<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная игра: Имя прилагательное (9 класс)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            font-size: 1.8rem;
        }

        /* Экраны игры */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Меню этапов */
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stage-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .stage-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* Процесс игры */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534;
        }

        .option-btn.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #991b1b;
        }

        .feedback-message {
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 24px;
        }

        /* Навигация внутри этапа */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }

        .nav-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: #475569;
            transition: background 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: #cbd5e1;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-btn.primary {
            background: var(--primary);
            color: white;
        }

        .nav-btn.primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        /* Экран результатов */
        .results-card {
            text-align: center;
            padding: 20px 0;
        }

        .results-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        /* Салют (эффект частиц) */
        .fireworks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            display: none;
            z-index: 10;
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="fireworks-container" id="fireworks"></div>

    <!-- Главное меню выбора этапов -->
    <div id="menu-screen" class="screen active">
        <h1>Интерактивный тренажер: Имя прилагательное (9 класс)</h1>
        <p>Выберите этап для прохождения. Каждый этап содержит 10 заданий для глубокой проработки темы.</p>
        <div class="stages-grid" id="stages-grid">
            <!-- Динамически заполняется через JS -->
        </div>
    </div>

    <!-- Экран игрового процесса -->
    <div id="game-screen" class="screen">
        <div class="question-header">
            <span id="stage-title-indicator">Этап 1</span>
            <span id="step-counter">Шаг 1 из 10</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div class="question-text" id="question-text">Текст вопроса появится здесь...</div>
        <div class="options-list" id="options-list"></div>
        
        <div class="feedback-message" id="feedback-message"></div>

        <div class="nav-controls">
            <button class="nav-btn" id="prev-btn" onclick="prevStep()">← Назад</button>
            <button class="nav-btn primary" id="next-btn" onclick="nextStep()" disabled>Вперед →</button>
        </div>
    </div>

    <!-- Экран итогов этапа -->
    <div id="results-screen" class="screen">
        <div class="results-card">
            <h1>Этап завершен!</h1>
            <p>Результаты прохождения этапа:</p>
            <div class="results-score" id="final-score">0 / 10</div>
            <p id="results-comment">Отличный результат!</p>
            <button class="nav-btn primary" style="margin-top: 20px;" onclick="returnToMenu()">Вернуться к списку этапов</button>
        </div>
    </div>
</div>

<script>
    // База данных игры: 4 этапа по 10 шагов (всего 40 заданий для полного охвата темы)
    const stagesData = [
        {
            title: "Этап 1: Синтаксическая роль и общие понятия",
            steps: [
                {
                    q: "Какую синтаксическую роль чаще всего выполняет полное имя прилагательное в предложении?",
                    options: ["Подлежащее", "Согласованное определение", "Дополнение", "Обстоятельство"],
                    correct: 1
                },
                {
                    q: "Какая часть речи является главным словом для имени прилагательного при согласовании?",
                    options: ["Глагол", "Наречие", "Имя существительное", "Местоимение"],
                    correct: 2
                },
                {
                    q: "В роли какого члена предложения обычно выступает краткое имя прилагательное?",
                    options: ["Определение", "Составное именное сказуемое", "Дополнение", "Несогласованное определение"],
                    correct: 1
                },
                {
                    q: "Укажите предложение, где прилагательное является сказуемым: «Ночь была тишна и лунна». Выделите сказуемое:",
                    options: ["была", "тишна и лунна", "ночь", "лунна"],
                    correct: 1
                },
                {
                    q: "Что изменяется у имен прилагательных при согласовании с существительным?",
                    options: ["Только число", "Только род", "Род, число и падеж", "Только время"],
                    correct: 2
                },
                {
                    q: "Какое из слов является именем прилагательным?",
                    options: ["Белизна", "Белеть", "Белый", "Беликом"],
                    correct: 2
                },
                {
                    q: "Какое синтаксическое явление представляет собой переход имени прилагательного в существительное?",
                    options: ["Субстантивация", "Инверсия", "Эллипсис", "Метафоризация"],
                    correct: 0
                },
                {
                    q: "Укажите словосочетание с согласованием:",
                    options: ["идти домой", "читая книгу", "летний день", "очень быстро"],
                    correct: 2
                },
                {
                    q: "Какое прилагательное в предложении «Утро оказалось морозным» выражает временной признак в составе сказуемого?",
                    options: ["Утро", "Оказалось", "Морозным", "Нет такого слова"],
                    correct: 2
                },
                {
                    q: "Какая морфологическая особенность отличает качественные прилагательные от относительных в синтаксисе предложений?",
                    options: ["Только полная форма", "Способность образовывать краткую форму", "Наличие падежей", "Наличие спряжения"],
                    correct: 1
                }
            ]
        },
        {
            title: "Этап 2: Разряды прилагательных",
            steps: [
                {
                    q: "На какие три основные разряда делятся имена прилагательные по значению?",
                    options: [
                        "Качественные, относительные, притяжательные",
                        "Простые, сложные, составные",
                        "Полные, краткие, субстантивированные",
                        "Твердые, мягкие, смешанные"
                    ],
                    correct: 0
                },
                {
                    q: "Укажите качественное прилагательное среди предложенных:",
                    options: ["Деревянный стол", "Мамин шарф", "Умный ребёнок", "Вчерашняя газета"],
                    correct: 2
                },
                {
                    q: "Какое прилагательное относится к разряду относительных?",
                    options: ["Высокая гора", "Шелковое платье", "Грустный взгляд", "Тихий вечер"],
                    correct: 1
                },
                {
                    q: "Какое прилагательное является притяжательным?",
                    options: ["Лисья нора (в значении жилище зверя)", "Лисий воротник (меховой)", "Лисья повадка (хитрая)", "Лисьи следы"],
                    correct: 0
                },
                {
                    q: "Какое свойство характерно именно для качественных прилагательных?",
                    options: ["Наличие степеней сравнения", "Обозначение материала", "Указание на принадлежность лицу", "Неизменяемость по родам"],
                    correct: 0
                },
                {
                    q: "Определите разряд прилагательного в словосочетании «железный характер» (переносное значение):",
                    options: ["Относительное", "Притяжательное", "Качественное", "Местоименное"],
                    correct: 2
                },
                {
                    q: "Какое словосочетание образовано с относительным прилагательным?",
                    options: ["Кирпичный дом", "Сладкий чай", "Быстрый бег", "Смелый поступок"],
                    correct: 0
                },
                {
                    q: "Какое из притяжательных прилагательных пишется с суффиксом -ий-?",
                    options: ["Отцов", "Медвежий", "Братнин", "Сестрин"],
                    correct: 1
                },
                {
                    q: "Могут ли относительные прилагательные образовывать краткую форму?",
                    options: ["Да, всегда", "Нет, не могут", "Только во множественном числе", "Только в среднем роде"],
                    correct: 1
                },
                {
                    q: "Какое прилагательное может сочетаться с наречием «очень»?",
                    options: ["Деревянный", "Школьный", "Крепкий", "Вчерашний"],
                    correct: 2
                }
            ]
        },
        {
            title: "Этап 3: Степени сравнения и нормы",
            steps: [
                {
                    q: "Какие две степени сравнения есть у качественных прилагательных?",
                    options: ["Высшая и низшая", "Сравнительная и превосходная", "Простая и сложная", "Полная и краткая"],
                    correct: 1
                },
                {
                    q: "Как образуется простая сравнительная степень прилагательного?",
                    options: ["С помощью суффиксов -е, -ей, -ше", "С помощью слов «более», «менее»", "С помощью суффиксов -ейш-, -айш-", "С помощью приставки наи-"],
                    correct: 0
                },
                {
                    q: "Укажите пример сложной превосходной степени:",
                    options: ["Красивейший", "Самый красивый", "Более красивый", "Красивее всех"],
                    correct: 1
                },
                {
                    q: "Какая форма степени сравнения образована с речевой ошибкой?",
                    options: ["Более умный", "Самый лучший", "Более красивее", "Строже"],
                    correct: 2
                },
                {
                    q: "Как образуется простая превосходная степень прилагательного?",
                    options: ["С помощью суффиксов -ейш-, -айш-", "С помощью слов «более» / «менее»", "С помощью суффиксов -е, -ей", "С помощью приставки пре-"],
                    correct: 0
                },
                {
                    q: "Какое прилагательное не имеет степеней сравнения?",
                    options: ["Высокий", "Слепой", "Добрый", "Умный"],
                    correct: 1
                },
                {
                    q: "Укажите правильный вариант сложной формы сравнительной степени:",
                    options: ["Более быстрый", "Более быстрее", "Самый быстрейший", "Наиболее быстрее"],
                    correct: 0
                },
                {
                    q: "Какая форма превосходной степени образуется добавлением слова «всех» к сравнительной степени?",
                    options: ["Простая превосходная", "Сложная превосходная", "Составная форма превосходной степени", "Не образуется ни одна"],
                    correct: 2
                },
                {
                    q: "Какое из слов имеет суффикс простой сравнительной степени?",
                    options: ["Умнейший", "Тише", "Наименьший", "Более сильный"],
                    correct: 1
                },
                {
                    q: "В чем опасность смешения простой и сложной форм степени сравнения?",
                    options: ["Это орфографическая ошибка", "Это грубая грамматическая (речевая) ошибка", "Это пунктуационная ошибка", "Это допустимо в деловом стиле"],
                    correct: 1
                }
            ]
        },
        {
            title: "Этап 4: Правописание Н и НН в прилагательных",
            steps: [
                {
                    q: "В суффиксах каких прилагательных пишется одна буква Н (-ан-, -ян-, -ин-)?",
                    options: ["Оловянный, деревянный, стеклянный", "Кожаный, серебряный, куриный", "Туманный, длинный, истинный", "Осенний, утренний, станционный"],
                    correct: 1
                },
                {
                    q: "Укажите исключение из правила о написании суффиксов -ан-, -ян-, -ин- (где пишется НН):",
                    options: ["Песчаный", "Глиняный", "Деревянный", "Ветряный"],
                    correct: 2
                },
                {
                    q: "Когда в суффиксах прилагательных пишется НН?",
                    options: ["В суффиксах -енн-, -онн- и на стыке морфем", "Всегда после гласных", "Только в краткой форме", "В качественных прилагательных"],
                    correct: 0
                },
                {
                    q: "Как пишется слово: «ветре..ый день»?",
                    options: ["Ветреный (с одной н)", "Ветренный (с двумя нн)", "Ветрянный", "Ветрянны"],
                    correct: 0
                },
                {
                    q: "Как пишется слово: «безветре..ая погода»?",
                    options: ["Безветренная (с нн)", "Безветреная (с одной н)", "Безветряная", "Безветренная с приставкой без-"],
                    correct: 0
                },
                {
                    q: "Укажите слово с двумя буквами Н (НН) в суффиксе:",
                    options: ["Соловьиный", "Юный", "Лекционный", "Багряный"],
                    correct: 2
                },
                {
                    q: "Сколько букв «н» пишется в слове «карман..ый»?",
                    options: ["Одна н", "Две нн", "Три н", "Зависит от контекста"],
                    correct: 0
                },
                {
                    q: "От какого слова образовано прилагательное «оловянный» (почему пишется НН)?",
                    options: ["Олово (суффикс -ян-)", "Оловянный — это исключение на -ян-", "Олово + суффикс -н-", "Образовано от глагола"],
                    correct: 1
                },
                {
                    q: "Сколько букв «н» пишется в краткой форме прилагательного, если в полной их было две (НН)?",
                    options: ["Столько же, сколько в полной (НН)", "Всегда одна (Н)", "Ни одной", "Зависит от рода"],
                    correct: 0
                },
                {
                    q: "Выберите правильное написание: «информацио..ый портал»",
                    options: ["Информационный", "Информационны", "Информационэйный", "Информационнный"],
                    correct: 0
                }
            ]
        }
    ];

    let currentStageIndex = 0;
    let currentStepIndex = 0;
    let userAnswers = []; // Сохраняет ответы пользователя для текущего этапа
    let score = 0;

    // Инициализация меню этапов
    function initMenu() {
        const grid = document.getElementById('stages-grid');
        grid.innerHTML = '';
        stagesData.forEach((stage, index) => {
            const btn = document.createElement('button');
            btn.className = 'stage-btn';
            btn.innerHTML = `<strong>Этап ${index + 1}</strong><br><span style="font-size: 0.85rem; font-weight: normal; color: #475569;">${stage.title}</span>`;
            btn.onclick = () => startStage(index);
            grid.appendChild(btn);
        });
    }

    function startStage(stageIndex) {
        currentStageIndex = stageIndex;
        currentStepIndex = 0;
        userAnswers = new Array(stagesData[stageIndex].steps.length).fill(null);
        
        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        
        document.getElementById('stage-title-indicator').innerText = stagesData[stageIndex].title;
        loadStep();
    }

    function loadStep() {
        const stage = stagesData[currentStageIndex];
        const step = stage.steps[currentStepIndex];
        const totalSteps = stage.steps.length;

        // Обновление прогресса
        document.getElementById('step-counter').innerText = `Шаг ${currentStepIndex + 1} из ${totalSteps}`;
        document.getElementById('progress-fill').style.width = `${((currentStepIndex + 1) / totalSteps) * 100}%`;

        // Текст вопроса
        document.getElementById('question-text').innerText = step.q;

        // Очистка сообщения
        document.getElementById('feedback-message').innerText = '';

        // Отрисовка вариантов
        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';

        step.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            // Если на этот шаг уже отвечали ранее
            if (userAnswers[currentStepIndex] !== null) {
                btn.disabled = true;
                if (idx === step.correct) {
                    btn.classList.add('correct');
                } else if (idx === userAnswers[currentStepIndex]) {
                    btn.classList.add('incorrect');
                }
            } else {
                btn.onclick = () => selectAnswer(idx);
            }
            optionsList.appendChild(btn);
        });

        // Кнопки навигации
        document.getElementById('prev-btn').disabled = currentStepIndex === 0;
        
        // Кнопка вперед активна только если на текущий вопрос дан верный ответ
        const isAnsweredCorrectly = userAnswers[currentStepIndex] === step.correct;
        document.getElementById('next-btn').disabled = !isAnsweredCorrectly;
        
        if (currentStepIndex === totalSteps - 1 && isAnsweredCorrectly) {
            document.getElementById('next-btn').innerText = 'Итоги этапа →';
        } else {
            document.getElementById('next-btn').innerText = 'Вперед →';
        }
    }

    function selectAnswer(selectedIndex) {
        const stage = stagesData[currentStageIndex];
        const step = stage.steps[currentStepIndex];
        const optionsList = document.getElementById('options-list');
        const buttons = optionsList.getElementsByTagName('button');

        userAnswers[currentStepIndex] = selectedIndex;

        if (selectedIndex === step.correct) {
            buttons[selectedIndex].classList.add('correct');
            document.getElementById('feedback-message').style.color = 'var(--success)';
            document.getElementById('feedback-message').innerText = 'Верно! Отличная работа.';
            
            // Запуск салюта при правильном ответе
            triggerFireworks();

            // Блокируем все кнопки вариантов
            for (let btn of buttons) {
                btn.disabled = true;
            }

            // Разблокируем кнопку "Вперед"
            document.getElementById('next-btn').disabled = false;
        } else {
            buttons[selectedIndex].classList.add('incorrect');
            document.getElementById('feedback-message').style.color = 'var(--error)';
            document.getElementById('feedback-message').innerText = 'Неверно. Попробуйте еще раз!';
            
            // Сбрасываем ответ через небольшую паузу, чтобы пользователь мог выбрать снова (согласно условию: "Неверные ответы возвращают к выполнению данного задания")
            setTimeout(() => {
                buttons[selectedIndex].classList.remove('incorrect');
                document.getElementById('feedback-message').innerText = '';
                userAnswers[currentStepIndex] = null;
            }, 1000);
        }
    }

    function nextStep() {
        const stage = stagesData[currentStageIndex];
        if (currentStepIndex < stage.steps.length - 1) {
            currentStepIndex++;
            loadStep();
        } else {
            showResults();
        }
    }

    function prevStep() {
        if (currentStepIndex > 0) {
            currentStepIndex--;
            loadStep();
        }
    }

    function showResults() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('results-screen').classList.add('active');

        const stage = stagesData[currentStageIndex];
        // Подсчет правильно отвеченных заданий с первого раза или всего
        // Поскольку неверные сбрасываются до правильного, считаем общее число шагов как успешно пройденное
        const correctCount = stage.steps.length; 

        document.getElementById('final-score').innerText = `${correctCount} / ${stage.steps.length}`;
        
        let comment = "Великолепный результат! Все задания этапа успешно выполнены.";
        document.getElementById('results-comment').innerText = comment;
        
        // Запускаем праздничный салют при завершении этапа
        triggerFireworks();
        setTimeout(triggerFireworks, 400);
    }

    function returnToMenu() {
        document.getElementById('results-screen').classList.remove('active');
        document.getElementById('menu-screen').classList.add('active');
        initMenu();
    }

    // Функция генерации салюта
    function triggerFireworks() {
        const container = document.getElementById('fireworks');
        container.style.display = 'block';
        
        const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
        const originX = window.innerWidth / 2 + (Math.random() * 200 - 100);
        const originY = window.innerHeight / 2 + (Math.random() * 100 - 50);

        for (let i = 0; i < 30; i++) {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            firework.style.left = '50%';
            firework.style.top = '50%';

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 150 + 50;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            firework.style.setProperty('--tx', `${tx}px`);
            firework.style.setProperty('--ty', `${ty}px`);

            container.appendChild(firework);

            setTimeout(() => {
                firework.remove();
                if (container.children.length === 0) {
                    container.style.display = 'none';
                }
            }, 800);
        }
    }

    // Инициализация при загрузке
    window.onload = initMenu;
</script>

</body>
</html>
